name: Process daily blog feedback

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-blog-feedback-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  feedback:
    if: github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      BLOG_REVIEWER: ${{ vars.BLOG_REVIEWER }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate and classify the reply
        id: decision
        run: |
          mkdir -p .daily-blog
          gh issue view "${{ github.event.issue.number }}" --json number,title,url,body,state,createdAt,labels,author > .daily-blog/review-issue.json
          node scripts/classify-blog-feedback.mjs "$GITHUB_EVENT_PATH" .daily-blog/review-issue.json > .daily-blog/decision.json
          echo "process=$(node -e "const x=require('./.daily-blog/decision.json'); console.log(x.process)")" >> "$GITHUB_OUTPUT"
          echo "action=$(node -e "const x=require('./.daily-blog/decision.json'); console.log(x.action)")" >> "$GITHUB_OUTPUT"
          echo "branch=$(node -e "const x=require('./.daily-blog/decision.json'); console.log(x.branch || '')")" >> "$GITHUB_OUTPUT"
          echo "post=$(node -e "const x=require('./.daily-blog/decision.json'); console.log(x.post || '')")" >> "$GITHUB_OUTPUT"

      - name: Close a skipped draft
        if: steps.decision.outputs.process == 'true' && steps.decision.outputs.action == 'skip'
        run: |
          git push origin --delete "${{ steps.decision.outputs.branch }}"
          gh issue close "${{ github.event.issue.number }}" --comment "Skipped by @$BLOG_REVIEWER from the review email."

      - name: Check out the daily draft
        if: steps.decision.outputs.process == 'true' && steps.decision.outputs.action == 'approve'
        run: |
          branch="${{ steps.decision.outputs.branch }}"
          git fetch origin "$branch"
          git checkout -B "$branch" "origin/$branch"

      - name: Install and validate an approved draft
        if: steps.decision.outputs.process == 'true' && steps.decision.outputs.action == 'approve'
        run: |
          npm ci
          node scripts/check-blog-style.mjs "${{ steps.decision.outputs.post }}"
          npm run build

      - name: Mark an approved draft ready for a pull request
        if: steps.decision.outputs.process == 'true' && steps.decision.outputs.action == 'approve'
        run: |
          sha="$(git rev-parse HEAD)"
          node scripts/prepare-blog-approval.mjs "${{ steps.decision.outputs.branch }}" "$sha" "$BLOG_REVIEWER"
          gh issue comment "${{ github.event.issue.number }}" --body-file .daily-blog/approval-comment.md
          gh issue edit "${{ github.event.issue.number }}" --add-label daily-blog-approved

      - name: Queue feedback for the marketing Mac agent
        if: steps.decision.outputs.process == 'true' && steps.decision.outputs.action == 'revise'
        run: |
          gh label create daily-blog-revision-requested --color FBCA04 --description "Editorial feedback queued for the marketing agent" --force
          node scripts/queue-blog-feedback.mjs .daily-blog/decision.json .daily-blog/review-issue.json
          gh issue edit "${{ github.event.issue.number }}" --body-file .daily-blog/review-issue-body.md --add-label daily-blog-revision-requested
