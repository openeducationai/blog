name: Process daily blog feedback

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  feedback:
    if: github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      BLOG_REVIEWER: ${{ vars.BLOG_REVIEWER }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-6-astra' }}
      OPENAI_REASONING_EFFORT: ${{ vars.OPENAI_REASONING_EFFORT || 'high' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate and classify the reply
        id: decision
        run: |
          mkdir -p .daily-blog
          gh pr view "${{ github.event.issue.number }}" --json number,title,url,body,headRefName,state,createdAt > .daily-blog/review-pr.json
          node scripts/classify-blog-feedback.mjs "$GITHUB_EVENT_PATH" .daily-blog/review-pr.json > .daily-blog/decision.json
          echo "process=$(node -e "const x=require('./.daily-blog/decision.json'); console.log(x.process)")" >> "$GITHUB_OUTPUT"
          echo "action=$(node -e "const x=require('./.daily-blog/decision.json'); console.log(x.action)")" >> "$GITHUB_OUTPUT"

      - name: Close a skipped draft
        if: steps.decision.outputs.process == 'true' && steps.decision.outputs.action == 'skip'
        run: |
          gh pr close "${{ github.event.issue.number }}" --delete-branch --comment "Skipped by @$BLOG_REVIEWER from the review email."

      - name: Check out the daily draft
        if: steps.decision.outputs.process == 'true' && steps.decision.outputs.action != 'skip'
        id: post
        run: |
          number="${{ github.event.issue.number }}"
          post="$(gh pr view "$number" --json files --jq '.files[].path | select(startswith("src/content/blog/"))' | head -n 1)"
          if [ -z "$post" ]; then
            echo "The draft PR does not contain a blog post."
            exit 1
          fi
          gh pr checkout "$number"
          echo "path=$post" >> "$GITHUB_OUTPUT"

      - name: Install and validate an approved draft
        if: steps.decision.outputs.process == 'true' && steps.decision.outputs.action == 'approve'
        run: |
          npm ci
          node scripts/check-blog-style.mjs "${{ steps.post.outputs.path }}"
          npm run build

      - name: Merge an approved draft
        if: steps.decision.outputs.process == 'true' && steps.decision.outputs.action == 'approve'
        run: |
          gh pr merge "${{ github.event.issue.number }}" --squash --delete-branch

      - name: Revise from email feedback
        if: steps.decision.outputs.process == 'true' && steps.decision.outputs.action == 'revise'
        run: |
          npm ci
          node scripts/revise-blog-from-feedback.mjs "${{ steps.post.outputs.path }}" .daily-blog/reviewer-feedback.txt
          node scripts/check-blog-style.mjs "${{ steps.post.outputs.path }}"
          npm run build

          git config user.name "padho-blog-bot"
          git config user.email "blog-bot@padho.ai"
          git add "${{ steps.post.outputs.path }}"
          if git diff --cached --quiet; then
            echo "The feedback produced no article change."
            exit 1
          fi
          git commit -m "blog: revise daily draft from review feedback"
          git push

      - name: Email the revised draft again
        if: steps.decision.outputs.process == 'true' && steps.decision.outputs.action == 'revise'
        run: |
          number="${{ github.event.issue.number }}"
          gh pr view "$number" --json number,title,url,body,headRefName,createdAt > .daily-blog/review-pr.json
          node scripts/prepare-blog-review.mjs .daily-blog/review-pr.json "${{ steps.post.outputs.path }}"
          gh pr comment "$number" --body-file .daily-blog/review-comment.md
