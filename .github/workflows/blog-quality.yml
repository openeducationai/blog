name: Blog quality

on:
  push:
    branches: [main]
    paths: ['src/**', 'scripts/**', 'editorial/**', 'skills/**', 'package*.json', '.github/workflows/blog-quality.yml']
  pull_request:
    paths: ['src/**', 'scripts/**', 'editorial/**', 'skills/**', 'package*.json', '.github/workflows/blog-quality.yml']

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check:editorial
      - run: npm test
      - run: npm run test:daily
      - run: npm run build
      - run: npm run check:search
