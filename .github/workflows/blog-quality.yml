name: Blog quality

on:
  pull_request:
    paths:
      - 'src/content/blog/**'
      - 'src/content.config.ts'
      - 'scripts/**'
      - 'automation/**'
      - '.github/workflows/blog-quality.yml'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Check changed blog posts
        run: |
          mapfile -t posts < <(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- 'src/content/blog/*.md' 'src/content/blog/*.mdx')
          if [ "${#posts[@]}" -gt 0 ]; then
            node scripts/check-blog-style.mjs "${posts[@]}"
          fi

      - run: npm run build
