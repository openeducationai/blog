<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" role="img" aria-labelledby="matrix-inverse-order-title"><title id="matrix-inverse-order-title">Choose the side that makes the inverse adjacent to the matrix being cancelled.</title><rect width="640" height="430" fill="white"/><g font-family="Inter,sans-serif" fill="#141212"><text x="320" y="48" text-anchor="middle" font-size="30">Put the inverse beside A</text><rect x="35" y="82" width="570" height="133" rx="12" fill="#e7eeff"/><text x="320" y="123" text-anchor="middle" font-size="26">PA = B · multiply on the right</text><text x="320" y="179" text-anchor="middle" font-size="32">P(AA⁻¹) = BA⁻¹</text><rect x="35" y="237" width="570" height="133" rx="12" fill="#fff2b7"/><text x="320" y="278" text-anchor="middle" font-size="26">AQ = B · multiply on the left</text><text x="320" y="334" text-anchor="middle" font-size="32">(A⁻¹A)Q = A⁻¹B</text><text x="320" y="414" text-anchor="middle" font-size="26">AA⁻¹ = A⁻¹A = I</text></g></svg>