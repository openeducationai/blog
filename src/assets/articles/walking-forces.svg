  <title id="walking-forces-title">The two pushes as you push off to take a step</title>
  <desc id="walking-forces-desc">A shoe rests on the ground, with its toe pointing right. A blue arrow on the shoe points forwards, to the right. An equally long orange arrow on the ground points backwards, to the left. The arrows show the horizontal forces at the same contact.</desc>
