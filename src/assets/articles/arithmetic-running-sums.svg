<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" role="img" aria-labelledby="arithmetic-running-sums-title"><title id="arithmetic-running-sums-title">Rows with three, five and seven seats have running totals three, eight and fifteen.</title><rect width="640" height="430" fill="white"/><g font-family="Inter,sans-serif" fill="#141212"><text x="320" y="44" text-anchor="middle" font-size="30">A new row changes the total</text><text x="70" y="99" font-size="25">Row</text><text x="280" y="99" text-anchor="middle" font-size="25">Seats in this row</text><text x="520" y="99" text-anchor="middle" font-size="25">Total so far</text><text x="88" y="161" text-anchor="middle" font-size="27">1</text><circle cx="250.0" cy="153" r="10" fill="#3568ff"/><circle cx="280.0" cy="153" r="10" fill="#3568ff"/><circle cx="310.0" cy="153" r="10" fill="#3568ff"/><text x="520" y="161" text-anchor="middle" font-size="27">S₁ = 3</text><text x="88" y="234" text-anchor="middle" font-size="27">2</text><circle cx="220.0" cy="226" r="10" fill="#3568ff"/><circle cx="250.0" cy="226" r="10" fill="#3568ff"/><circle cx="280.0" cy="226" r="10" fill="#3568ff"/><circle cx="310.0" cy="226" r="10" fill="#3568ff"/><circle cx="340.0" cy="226" r="10" fill="#3568ff"/><text x="520" y="234" text-anchor="middle" font-size="27">S₂ = 8</text><text x="88" y="307" text-anchor="middle" font-size="27">3</text><circle cx="190.0" cy="299" r="10" fill="#3568ff"/><circle cx="220.0" cy="299" r="10" fill="#3568ff"/><circle cx="250.0" cy="299" r="10" fill="#3568ff"/><circle cx="280.0" cy="299" r="10" fill="#3568ff"/><circle cx="310.0" cy="299" r="10" fill="#3568ff"/><circle cx="340.0" cy="299" r="10" fill="#3568ff"/><circle cx="370.0" cy="299" r="10" fill="#3568ff"/><text x="520" y="307" text-anchor="middle" font-size="27">S₃ = 15</text><path d="M55 337 H585" stroke="#e7e2d8" stroke-width="2"/><text x="320" y="380" text-anchor="middle" font-size="29">third row = S₃ − S₂ = 15 − 8 = 7</text><text x="320" y="418" text-anchor="middle" font-size="25">One term is the change in the total.</text></g></svg>