<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" role="img" aria-label="A series resistor and meter share 30 volts"><rect width="640" height="430" fill="white"/><g font-family="Inter,sans-serif" fill="#141212"><text x="320" y="52" text-anchor="middle" font-size="29">One current, two voltage drops</text><path d="M72 215 H135 M285 215 H345 M495 215 H568" stroke="#3568ff" stroke-width="4" fill="none"/><rect x="135" y="175" width="150" height="80" rx="8" fill="#edf1ff" stroke="#3568ff" stroke-width="3"/><circle cx="420" cy="215" r="72" fill="#fff4ec" stroke="#ff8235" stroke-width="3"/><text x="210" y="222" text-anchor="middle" font-size="24">resistor</text><text x="420" y="222" text-anchor="middle" font-size="24">meter</text><text x="210" y="300" text-anchor="middle" font-size="26">10 V</text><text x="420" y="320" text-anchor="middle" font-size="26">20 V</text><path d="M110 350 V365 H530 V350" fill="none" stroke="#606a82" stroke-width="2"/><text x="320" y="405" text-anchor="middle" font-size="28">total 30 V</text><text x="320" y="145" text-anchor="middle" font-size="24">same current I →</text></g></svg>
