<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" role="img" aria-labelledby="gravitational-energy-distance-title"><title id="gravitational-energy-distance-title">A height of twice Earth’s radius corresponds to three radii from the centre.</title><rect width="640" height="430" fill="white"/><g font-family="Inter,sans-serif" fill="#141212"><text x="320" y="44" text-anchor="middle" font-size="30">Measure from Earth’s centre</text><circle cx="162" cy="218" r="90" fill="#edf1ff" stroke="#3568ff" stroke-width="3"/><text x="162" y="183" text-anchor="middle" font-size="28">Earth</text><circle cx="162" cy="218" r="5" fill="#141212"/><path d="M162 218 H432" stroke="#606a82" stroke-width="2" stroke-dasharray="6 6"/><circle cx="252" cy="218" r="7" fill="#3568ff"/><circle cx="432" cy="218" r="8" fill="#ff8235"/><text x="442" y="192" font-size="26">payload</text><path d="M162 337 H252 M162 328 V346 M252 328 V346" stroke="#3568ff" stroke-width="2"/><text x="207" y="372" text-anchor="middle" font-size="27">R</text><path d="M252 337 H432 M252 328 V346 M432 328 V346" stroke="#ff8235" stroke-width="3"/><text x="342" y="372" text-anchor="middle" font-size="27">height = 2R</text><text x="320" y="415" text-anchor="middle" font-size="26">centre-distance: R + 2R = 3R</text><text x="252" y="113" text-anchor="middle" font-size="25">surface</text><path d="M252 126 V199" stroke="#3568ff" stroke-width="2"/></g></svg>