<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" role="img" aria-labelledby="tetrahedral-energy-levels-title"><title id="tetrahedral-energy-levels-title">Tetrahedral d orbitals split into two lower e orbitals and three upper t₂ orbitals.</title><rect width="640" height="430" fill="white"/><g font-family="Inter,sans-serif" fill="#141212"><text x="320" y="45" text-anchor="middle" font-size="30">Tetrahedral orbital energies</text><path d="M55 350 V86 M45 100 L55 86 L65 100" fill="none" stroke="#606a82" stroke-width="3"/><text x="90" y="100" font-size="24">Energy</text><text x="295" y="103" text-anchor="middle" font-size="24">d(xy), d(xz), d(yz)</text><path d="M190 137 H245 M265 137 H320 M340 137 H395" stroke="#ff8235" stroke-width="5"/><text x="145" y="146" text-anchor="end" font-size="28">t₂</text><text x="607" y="146" text-anchor="end" font-size="26">+0.4Δt</text><path d="M90 204 H610" stroke="#858078" stroke-width="2" stroke-dasharray="7 7"/><text x="260" y="241" text-anchor="middle" font-size="24">Average-energy reference</text><path d="M220 304 H275 M300 304 H355" stroke="#3568ff" stroke-width="5"/><text x="145" y="313" text-anchor="end" font-size="28">e</text><text x="607" y="313" text-anchor="end" font-size="26">−0.6Δt</text><text x="290" y="347" text-anchor="middle" font-size="24">d(z²), d(x² − y²)</text><path d="M435 137 V304 M428 148 L435 137 L442 148 M428 293 L435 304 L442 293" fill="none" stroke="#141212" stroke-width="2"/><text x="450" y="185" font-size="26">Δt</text><text x="320" y="408" text-anchor="middle" font-size="26">One line = one orbital</text></g></svg>