<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" role="img" aria-labelledby="linear-system-consistency-title"><title id="linear-system-consistency-title">Subtracting twice x plus y equals ten from a second equation gives zero equals zero if its total is twenty, or zero equals three if its total is twenty-three.</title><rect width="640" height="430" fill="white"/><g font-family="Inter,sans-serif" fill="#141212"><text x="320" y="46" text-anchor="middle" font-size="30">Do the two bills agree?</text><text x="320" y="100" text-anchor="middle" font-size="28">First bill: x + y = 10</text><rect x="45" y="135" width="550" height="112" rx="12" fill="#edf1ff"/><text x="320" y="174" text-anchor="middle" font-size="28">Second bill: 2x + 2y = 20</text><text x="320" y="220" text-anchor="middle" font-size="26">Subtract twice the first: 0 = 0</text><rect x="45" y="272" width="550" height="112" rx="12" fill="#fff0e5"/><text x="320" y="311" text-anchor="middle" font-size="28">Second bill: 2x + 2y = 23</text><text x="320" y="357" text-anchor="middle" font-size="26">Subtract twice the first: 0 = 3</text><text x="320" y="420" text-anchor="middle" font-size="24">Same prices, same items, no extra charge</text></g></svg>