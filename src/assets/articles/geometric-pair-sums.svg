<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" role="img" aria-labelledby="geometric-pair-sums-title"><title id="geometric-pair-sums-title">Multiply both terms by r squared to multiply their pair sum by r squared.</title><rect width="640" height="430" fill="white"/><g font-family="Inter,sans-serif" fill="#141212"><text x="320" y="45" text-anchor="middle" font-size="30">Two steps multiply by r²</text><rect x="45" y="88" width="550" height="95" rx="12" fill="#e7eeff"/><text x="105" y="148" font-size="32">u</text><text x="210" y="148" font-size="32">+</text><text x="310" y="148" font-size="32">ur</text><text x="550" y="148" text-anchor="end" font-size="27">= u(1 + r)</text><path d="M115 195 V252 M106 240 L115 252 L124 240 M325 195 V252 M316 240 L325 252 L334 240" fill="none" stroke="#606a82" stroke-width="3"/><text x="144" y="231" font-size="26">×r²</text><text x="354" y="231" font-size="26">×r²</text><rect x="45" y="267" width="550" height="95" rx="12" fill="#fff2b7"/><text x="90" y="327" font-size="32">ur²</text><text x="210" y="327" font-size="32">+</text><text x="300" y="327" font-size="32">ur³</text><text x="557" y="327" text-anchor="end" font-size="27">= r²u(1 + r)</text><text x="320" y="414" text-anchor="middle" font-size="25">Check the first pair sum before dividing.</text></g></svg>