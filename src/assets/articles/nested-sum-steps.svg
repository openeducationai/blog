<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" role="img" aria-labelledby="nested-sum-steps-title"><title id="nested-sum-steps-title">In the third term, the numerator one cubed plus two cubed plus three cubed is thirty-six; the denominator one plus three plus five is nine; the quotient is four.</title><rect width="640" height="430" fill="white"/><g font-family="Inter,sans-serif" fill="#141212"><text x="320" y="48" text-anchor="middle" font-size="30">Simplify one whole term</text><rect x="45" y="90" width="550" height="92" rx="12" fill="#edf1ff"/><text x="320" y="127" text-anchor="middle" font-size="25">numerator</text><text x="320" y="164" text-anchor="middle" font-size="30">1³ + 2³ + 3³ = 36</text><path d="M70 201 H570" stroke="#606a82" stroke-width="2"/><rect x="45" y="220" width="550" height="92" rx="12" fill="#fff0e5"/><text x="320" y="257" text-anchor="middle" font-size="25">denominator</text><text x="320" y="294" text-anchor="middle" font-size="30">1 + 3 + 5 = 9</text><text x="320" y="380" text-anchor="middle" font-size="30">third term = 36 ÷ 9 = 4</text></g></svg>