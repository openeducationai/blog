<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" role="img" aria-labelledby="mass-to-moles-title"><title id="mass-to-moles-title">Split 100 grams of solution into 10 grams of urea and 90 grams of water, then divide by 60 and 18 grams per mole.</title><rect width="640" height="430" fill="white"/><g font-family="Inter,sans-serif" fill="#141212"><text x="320" y="52" text-anchor="middle" font-size="30">100 g of solution</text><path d="M320 75 V100 H175 V130 M320 100 H465 V130" fill="none" stroke="#606a82" stroke-width="3"/><rect x="60" y="135" width="230" height="110" rx="12" fill="#edf1ff"/><rect x="350" y="135" width="230" height="110" rx="12" fill="#fff0e5"/><text x="175" y="177" text-anchor="middle" font-size="27">Urea</text><text x="175" y="220" text-anchor="middle" font-size="30">10 g</text><text x="465" y="177" text-anchor="middle" font-size="27">Water</text><text x="465" y="220" text-anchor="middle" font-size="30">90 g</text><path d="M175 255 V290 M465 255 V290" fill="none" stroke="#606a82" stroke-width="3"/><text x="175" y="325" text-anchor="middle" font-size="26">÷ 60 g/mol</text><text x="465" y="325" text-anchor="middle" font-size="26">÷ 18 g/mol</text><text x="320" y="390" text-anchor="middle" font-size="27">Convert each mass to moles</text></g></svg>