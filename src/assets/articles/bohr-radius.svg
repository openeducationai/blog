<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" role="img" aria-label="Hydrogen first orbit and beryllium ion second orbit have equal Bohr radii"><rect width="640" height="430" fill="white"/><g font-family="Inter,sans-serif" fill="#141212"><text x="320" y="50" text-anchor="middle" font-size="28">Compare n²/Z</text><circle cx="175" cy="200" r="90" fill="#edf1ff" stroke="#3568ff" stroke-width="3"/><circle cx="175" cy="200" r="9" fill="#3568ff"/><circle cx="465" cy="200" r="90" fill="#fff4ec" stroke="#ff8235" stroke-width="3"/><circle cx="465" cy="200" r="9" fill="#ff8235"/><text x="175" y="330" text-anchor="middle" font-size="25">H: 1²/1 = 1</text><text x="465" y="330" text-anchor="middle" font-size="25">Be³⁺: 2²/4 = 1</text><text x="320" y="390" text-anchor="middle" font-size="27">Both radii = a₀</text></g></svg>
