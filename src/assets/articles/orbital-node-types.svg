<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" role="img" aria-labelledby="orbital-node-types-title"><title id="orbital-node-types-title">Radial nodes are spherical surfaces; the angular node of a real p orbital is a plane.</title><rect width="640" height="430" fill="white"/><g font-family="Inter,sans-serif" fill="#141212"><text x="320" y="43" text-anchor="middle" font-size="30">Two kinds of nodal surface</text><text x="165" y="98" text-anchor="middle" font-size="27">Radial</text><text x="475" y="98" text-anchor="middle" font-size="27">Angular</text><circle cx="165" cy="230" r="94" fill="#e7eeff"/><circle cx="165" cy="230" r="60" fill="#fff2b7" stroke="#ff8235" stroke-width="4" stroke-dasharray="8 6"/><circle cx="165" cy="230" r="5" fill="#141212"/><ellipse cx="419" cy="230" rx="49" ry="72" fill="#e7eeff" stroke="#3568ff" stroke-width="2"/><ellipse cx="531" cy="230" rx="49" ry="72" fill="#fff2b7" stroke="#ff8235" stroke-width="2"/><path d="M475 130 V330" stroke="#606a82" stroke-width="4" stroke-dasharray="8 6"/><circle cx="475" cy="230" r="5" fill="#141212"/><text x="165" y="367" text-anchor="middle" font-size="24">Sphere, seen in section</text><text x="475" y="367" text-anchor="middle" font-size="24">Plane, seen in section</text><text x="320" y="413" text-anchor="middle" font-size="24">Dots mark nuclei · dashed lines mark nodes</text></g></svg>