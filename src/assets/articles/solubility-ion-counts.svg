<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" role="img" aria-labelledby="solubility-ion-counts-title"><title id="solubility-ion-counts-title">Three cations and two anions come from each formula unit of M3A2.</title><rect width="640" height="430" fill="white"/><g font-family="Inter,sans-serif" fill="#141212"><text x="320" y="43" text-anchor="middle" font-size="29">Count each kind of ion</text><text x="320" y="105" text-anchor="middle" font-size="28">M₃A₂(s) ⇌ 3M²⁺(aq) + 2A³⁻(aq)</text><circle cx="105" cy="203" r="36" fill="#e7eeff" stroke="#3568ff" stroke-width="2"/><circle cx="190" cy="203" r="36" fill="#e7eeff" stroke="#3568ff" stroke-width="2"/><circle cx="275" cy="203" r="36" fill="#e7eeff" stroke="#3568ff" stroke-width="2"/><circle cx="420" cy="203" r="36" fill="#fff0e7" stroke="#ff8235" stroke-width="2"/><circle cx="515" cy="203" r="36" fill="#fff0e7" stroke="#ff8235" stroke-width="2"/><g text-anchor="middle" font-size="25"><text x="105" y="212">M²⁺</text><text x="190" y="212">M²⁺</text><text x="275" y="212">M²⁺</text><text x="420" y="212">A³⁻</text><text x="515" y="212">A³⁻</text><text x="190" y="292">[M²⁺] = 3s</text><text x="468" y="292">[A³⁻] = 2s</text></g><text x="320" y="373" text-anchor="middle" font-size="26">s = moles of salt per litre</text></g></svg>