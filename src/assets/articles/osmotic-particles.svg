<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" role="img" aria-labelledby="osmotic-particles-title"><title id="osmotic-particles-title">Glucose gives one dissolved particle per molecule; complete NaCl dissociation gives two ions per formula unit.</title><rect width="640" height="430" fill="white"/><text x="320" y="55" text-anchor="middle" fill="#141212" font-size="32" font-family="Inter,sans-serif" font-weight="400">One glucose molecule</text><circle cx="320" cy="115" r="26" fill="#3568ff"/><text x="320" y="177" text-anchor="middle" fill="#141212" font-size="32" font-family="Inter,sans-serif" font-weight="400">1 dissolved particle</text><text x="320" y="250" text-anchor="middle" fill="#141212" font-size="32" font-family="Inter,sans-serif" font-weight="400">One NaCl formula unit</text><circle cx="235" cy="312" r="32" fill="#3568ff"/><circle cx="405" cy="312" r="32" fill="#ff8235"/><text x="235" y="322" text-anchor="middle" fill="white" font-size="24" font-family="Inter,sans-serif" font-weight="400">Na⁺</text><text x="405" y="322" text-anchor="middle" fill="#141212" font-size="24" font-family="Inter,sans-serif" font-weight="400">Cl⁻</text><text x="320" y="390" text-anchor="middle" fill="#141212" font-size="32" font-family="Inter,sans-serif" font-weight="400">2 ions after dissociation</text></svg>