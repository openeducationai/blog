<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" role="img" aria-labelledby="nuclear-binding-totals-title"><title id="nuclear-binding-totals-title">Stronger total binding lowers the energy of the same four nucleons.</title><rect width="640" height="430" fill="white"/><g font-family="Inter,sans-serif" fill="#141212"><text x="320" y="40" text-anchor="middle" font-size="29">Same particles, lower energy</text><path d="M55 95 H600" stroke="#606a82" stroke-width="3"/><text x="320" y="80" text-anchor="middle" font-size="24">Separated nucleons: reference 0</text><path d="M75 220 H280 M365 325 H580" stroke="#3568ff" stroke-width="4"/><text x="175" y="196" text-anchor="middle" font-size="25">Initial: −8 MeV</text><text x="475" y="301" text-anchor="middle" font-size="25">Final: −14 MeV</text><path d="M315 225 V321 M305 307 L315 321 L325 307" stroke="#ff8235" fill="none" stroke-width="4"/><text x="320" y="380" text-anchor="middle" font-size="26">Energy released: 14 − 8 = 6 MeV</text><text x="320" y="414" text-anchor="middle" font-size="21">Schematic example</text></g></svg>