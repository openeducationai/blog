<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" role="img" aria-labelledby="buffer-neutralisation-title"><title id="buffer-neutralisation-title">Half the initial weak acid changes to its conjugate base; equal amounts remain.</title><rect width="640" height="430" fill="white"/><text x="320" y="55" text-anchor="middle" fill="#141212" font-size="30" font-family="Inter,sans-serif">Before adding base</text><rect x="120" y="78" width="400" height="76" rx="12" fill="#3568ff"/><text x="320" y="127" text-anchor="middle" fill="white" font-size="27" font-family="Inter,sans-serif">weak acid: 2.84 mmol</text><path d="M320 168 V205 M305 190 L320 205 L335 190" fill="none" stroke="#141212" stroke-width="3"/><text x="320" y="246" text-anchor="middle" fill="#141212" font-size="27" font-family="Inter,sans-serif">After half-neutralisation</text><rect x="120" y="270" width="200" height="76" rx="10" fill="#3568ff"/><rect x="320" y="270" width="200" height="76" rx="10" fill="#ff8235"/><text x="220" y="315" text-anchor="middle" fill="white" font-size="21" font-family="Inter,sans-serif">acid: 1.42</text><text x="420" y="315" text-anchor="middle" fill="#141212" font-size="21" font-family="Inter,sans-serif">base: 1.42</text><text x="320" y="390" text-anchor="middle" fill="#141212" font-size="24" font-family="Inter,sans-serif">amounts in mmol, before equilibrium adjustment</text></svg>