<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" role="img" aria-labelledby="flow-area-speed-title"><title id="flow-area-speed-title">Equal volumes cross the wide and narrow sections in the same time.</title><rect width="640" height="430" fill="white"/><g font-family="Inter,sans-serif" fill="#141212"><text x="320" y="45" text-anchor="middle" font-size="30">Same water per second</text><path d="M45 125 H240 L390 175 H595 M45 305 H240 L390 255 H595" fill="none" stroke="#606a82" stroke-width="4"/><rect x="90" y="127" width="70" height="176" fill="#e7eeff"/><rect x="410" y="177" width="140" height="76" fill="#fff2b7"/><path d="M90 215 H160 M147 205 L160 215 L147 225" fill="none" stroke="#3568ff" stroke-width="4"/><path d="M410 215 H550 M537 205 L550 215 L537 225" fill="none" stroke="#ff8235" stroke-width="4"/><text x="125" y="98" text-anchor="middle" font-size="26">Area A</text><text x="480" y="145" text-anchor="middle" font-size="26">Area A/2</text><text x="125" y="345" text-anchor="middle" font-size="26">Speed v</text><text x="480" y="345" text-anchor="middle" font-size="26">Speed 2v</text><text x="320" y="405" text-anchor="middle" font-size="26">A × v = (A/2) × 2v</text></g></svg>