<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" role="img" aria-labelledby="measurement-error-budget-title"><title id="measurement-error-budget-title">Three positive fractional contributions combine in the first-order maximum density error.</title><rect width="640" height="430" fill="white"/><g font-family="Inter,sans-serif" fill="#141212"><text x="320" y="48" text-anchor="middle" font-size="30">Density = 4m / (πd²l)</text><rect x="40" y="90" width="560" height="68" rx="12" fill="#edf1ff"/><text x="70" y="133" font-size="28">Mass</text><text x="550" y="133" text-anchor="end" font-size="30">Δm / m</text><rect x="40" y="176" width="560" height="68" rx="12" fill="#edf1ff"/><text x="70" y="219" font-size="28">Length</text><text x="550" y="219" text-anchor="end" font-size="30">Δl / l</text><rect x="40" y="262" width="560" height="68" rx="12" fill="#fff0e5"/><text x="70" y="305" font-size="28">Diameter squared</text><text x="550" y="305" text-anchor="end" font-size="30">2Δd / d</text><text x="320" y="380" text-anchor="middle" font-size="28">Add the three contributions</text><text x="320" y="417" text-anchor="middle" font-size="24">Small errors · maximum-error estimate</text></g></svg>