<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" role="img" aria-labelledby="heat-work-cycle-title"><title id="heat-work-cycle-title">A gas absorbs twelve joules of heat and does five joules of work, gaining seven joules of internal energy. Returning to the starting state reverses this change.</title><rect width="640" height="430" fill="white"/><g font-family="Inter,sans-serif" fill="#141212"><text x="320" y="48" text-anchor="middle" font-size="30">Follow energy in the gas</text><rect x="220" y="135" width="200" height="105" rx="12" fill="#edf1ff" stroke="#3568ff" stroke-width="2"/><text x="320" y="177" text-anchor="middle" font-size="28">gas</text><text x="320" y="216" text-anchor="middle" font-size="25">ΔU = +7 J</text><path d="M55 185 H205 M205 185 l-15 -8 M205 185 l-15 8" fill="none" stroke="#3568ff" stroke-width="3"/><path d="M435 185 H585 M585 185 l-15 -8 M585 185 l-15 8" fill="none" stroke="#ff8235" stroke-width="3"/><text x="125" y="112" text-anchor="middle" font-size="25">heat in</text><text x="125" y="145" text-anchor="middle" font-size="25">12 J</text><text x="515" y="112" text-anchor="middle" font-size="25">work out</text><text x="515" y="145" text-anchor="middle" font-size="25">5 J</text><text x="320" y="300" text-anchor="middle" font-size="26">X → Y: ΔU = +7 J</text><text x="320" y="347" text-anchor="middle" font-size="26">Y → X: ΔU = −7 J</text><text x="320" y="401" text-anchor="middle" font-size="25">Full cycle: total ΔU = 0</text></g></svg>