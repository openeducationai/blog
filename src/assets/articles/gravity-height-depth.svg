<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" role="img" aria-labelledby="gravity-height-depth-title"><title id="gravity-height-depth-title">From Earth’s centre to the object, the distance is the radius R plus the height h.</title><rect width="640" height="430" fill="white"/><g font-family="Inter,sans-serif" fill="#141212"><text x="320" y="52" text-anchor="middle" font-size="30">Measure from the centre</text><circle cx="180" cy="205" r="110" fill="#edf1ff" stroke="#3568ff" stroke-width="3"/><circle cx="180" cy="205" r="5" fill="#3568ff"/><circle cx="550" cy="205" r="8" fill="#ff8235"/><path d="M180 205 H290" stroke="#3568ff" stroke-width="4"/><path d="M290 205 H550" stroke="#ff8235" stroke-width="4"/><path d="M290 190 V220 M550 190 V220" stroke="#606a82" stroke-width="2"/><text x="230" y="190" font-size="28">R</text><text x="410" y="190" font-size="28">h</text><text x="160" y="250" text-anchor="middle" font-size="23">centre</text><text x="320" y="250" text-anchor="middle" font-size="23">surface</text><text x="550" y="250" text-anchor="middle" font-size="23">object</text><path d="M180 330 V345 H550 V330" fill="none" stroke="#606a82" stroke-width="2"/><text x="365" y="385" text-anchor="middle" font-size="30">r = R + h</text></g></svg>