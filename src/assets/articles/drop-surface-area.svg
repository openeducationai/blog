<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" role="img" aria-labelledby="drop-surface-area-title"><title id="drop-surface-area-title">Eight equal spherical drops preserve volume but have twice the surface area of the original drop.</title><rect width="640" height="430" fill="white"/><g font-family="Inter,sans-serif" fill="#141212"><text x="320" y="48" text-anchor="middle" font-size="30">Same liquid · more surface</text><circle cx="120" cy="190" r="70" fill="#e7eeff" stroke="#3568ff" stroke-width="3"/><path d="M120 190 H190" stroke="#3568ff" stroke-width="3"/><text x="143" y="178" font-size="26">R</text><path d="M215 190 H275 M261 179 L275 190 L261 201" fill="none" stroke="#606a82" stroke-width="3"/><circle cx="320" cy="150" r="35" fill="#e7eeff" stroke="#3568ff" stroke-width="3"/><circle cx="320" cy="230" r="35" fill="#e7eeff" stroke="#3568ff" stroke-width="3"/><circle cx="400" cy="150" r="35" fill="#e7eeff" stroke="#3568ff" stroke-width="3"/><circle cx="400" cy="230" r="35" fill="#e7eeff" stroke="#3568ff" stroke-width="3"/><circle cx="480" cy="150" r="35" fill="#e7eeff" stroke="#3568ff" stroke-width="3"/><circle cx="480" cy="230" r="35" fill="#e7eeff" stroke="#3568ff" stroke-width="3"/><circle cx="560" cy="150" r="35" fill="#e7eeff" stroke="#3568ff" stroke-width="3"/><circle cx="560" cy="230" r="35" fill="#e7eeff" stroke="#3568ff" stroke-width="3"/><text x="120" y="304" text-anchor="middle" font-size="27">One drop</text><text x="440" y="304" text-anchor="middle" font-size="27">8 drops · radius R/2</text><text x="120" y="354" text-anchor="middle" font-size="26">Area A</text><text x="440" y="354" text-anchor="middle" font-size="26">Total area 2A</text><text x="320" y="411" text-anchor="middle" font-size="26">Energy increase = γ × added area</text></g></svg>