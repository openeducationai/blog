<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" role="img" aria-labelledby="hess-enthalpy-path-title"><title id="hess-enthalpy-path-title">Reverse reactant formation then form products from the same elements.</title><rect width="640" height="430" fill="white"/><g font-family="Inter,sans-serif" fill="#141212"><text x="320" y="45" text-anchor="middle" font-size="30">Two routes, same change</text><text x="135" y="118" text-anchor="middle" font-size="27">Reactants</text><text x="510" y="118" text-anchor="middle" font-size="27">Products</text><path d="M230 108 H410 M396 98 L410 108 L396 118" fill="none" stroke="#3568ff" stroke-width="4"/><text x="320" y="90" text-anchor="middle" font-size="24">ΔrH°</text><path d="M130 140 V295 H214 M201 285 L214 295 L201 305" fill="none" stroke="#ff8235" stroke-width="4"/><path d="M426 295 H510 V145 M500 159 L510 145 L520 159" fill="none" stroke="#3568ff" stroke-width="4"/><text x="320" y="288" text-anchor="middle" font-size="26">Same elements</text><text x="320" y="321" text-anchor="middle" font-size="23">Reference states</text><text x="218" y="190" text-anchor="middle" font-size="23">Reverse</text><text x="218" y="219" text-anchor="middle" font-size="23">formation</text><text x="425" y="190" text-anchor="middle" font-size="23">Form the</text><text x="425" y="219" text-anchor="middle" font-size="23">products</text><text x="320" y="396" text-anchor="middle" font-size="25">Product total − reactant total</text></g></svg>