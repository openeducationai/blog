<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" role="img" aria-labelledby="equilibrium-reaction-steps-title"><title id="equilibrium-reaction-steps-title">Two equilibrium steps combine by cancelling their intermediate and multiplying their constants.</title><rect width="640" height="430" fill="white"/><g font-family="Inter,sans-serif" fill="#141212"><text x="320" y="44" text-anchor="middle" font-size="30">Cancel the same intermediate</text><rect x="40" y="78" width="560" height="85" rx="12" fill="#e7eeff"/><text x="75" y="131" font-size="30">A ⇌ B</text><text x="560" y="131" text-anchor="end" font-size="28">K₁ = [B]/[A]</text><rect x="40" y="182" width="560" height="85" rx="12" fill="#fff2b7"/><text x="75" y="235" font-size="30">B ⇌ C</text><text x="560" y="235" text-anchor="end" font-size="28">K₂ = [C]/[B]</text><path d="M320 279 V312 M309 300 L320 312 L331 300" fill="none" stroke="#606a82" stroke-width="3"/><text x="75" y="367" font-size="30">A ⇌ C</text><text x="560" y="367" text-anchor="end" font-size="28">K₁K₂ = [C]/[A]</text><text x="320" y="414" text-anchor="middle" font-size="24">Same temperature · same convention</text></g></svg>