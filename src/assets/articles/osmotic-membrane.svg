<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="osmotic-membrane-title"><title id="osmotic-membrane-title">Equal volumes of two 0.1 molar solutions separated by a water-only membrane.</title><rect width="1440" height="810" fill="#f0ebe4"/><rect x="170" y="240" width="1100" height="350" fill="#e7eeff"/><path d="M170 180 V600 H1270 V180" fill="none" stroke="#141212" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M720 180 V600" stroke="#606a82" stroke-width="8" stroke-dasharray="16 16"/><text x="440" y="150" text-anchor="middle" fill="#141212" font-size="64" font-family="Inter,sans-serif" font-weight="400">Side x</text><text x="1000" y="150" text-anchor="middle" fill="#141212" font-size="64" font-family="Inter,sans-serif" font-weight="400">Side y</text><text x="440" y="335" text-anchor="middle" fill="#141212" font-size="48" font-family="Inter,sans-serif" font-weight="400">0.1 M K₄[Fe(CN)₆]</text><text x="1000" y="335" text-anchor="middle" fill="#141212" font-size="48" font-family="Inter,sans-serif" font-weight="400">0.1 M FeCl₃</text><text x="440" y="425" text-anchor="middle" fill="#141212" font-size="48" font-family="Inter,sans-serif" font-weight="400">1 L</text><text x="1000" y="425" text-anchor="middle" fill="#141212" font-size="48" font-family="Inter,sans-serif" font-weight="400">1 L</text><path d="M630 500 H810 M790 480 L810 500 L790 520 M810 555 H630 M650 535 L630 555 L650 575" fill="none" stroke="#3568ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="720" y="720" text-anchor="middle" fill="#141212" font-size="48" font-family="Inter,sans-serif" font-weight="400">Only water crosses the membrane</text></svg>