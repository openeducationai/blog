<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" role="img" aria-labelledby="magnesium-ionisation-title"><title id="magnesium-ionisation-title">Separate ionisation steps remove the two outer 3s electrons from magnesium.</title><rect width="640" height="430" fill="white"/><g font-family="Inter,sans-serif" fill="#141212"><text x="320" y="45" text-anchor="middle" font-size="30">Start each step from its ion</text><text x="100" y="133" text-anchor="middle" font-size="30">Mg</text><text x="320" y="133" text-anchor="middle" font-size="30">Mg⁺</text><text x="540" y="133" text-anchor="middle" font-size="30">Mg²⁺</text><rect x="58" y="170" width="84" height="70" rx="8" fill="#e7eeff" stroke="#3568ff" stroke-width="2"/><rect x="278" y="170" width="84" height="70" rx="8" fill="#e7eeff" stroke="#3568ff" stroke-width="2"/><rect x="498" y="170" width="84" height="70" rx="8" fill="white" stroke="#606a82" stroke-width="2"/><circle cx="83" cy="205" r="9" fill="#3568ff"/><circle cx="117" cy="205" r="9" fill="#3568ff"/><circle cx="320" cy="205" r="9" fill="#3568ff"/><path d="M165 205 H255 M242 195 L255 205 L242 215 M385 205 H475 M462 195 L475 205 L462 215" fill="none" stroke="#ff8235" stroke-width="3"/><text x="210" y="182" text-anchor="middle" font-size="24">− e⁻</text><text x="430" y="182" text-anchor="middle" font-size="24">− e⁻</text><text x="100" y="285" text-anchor="middle" font-size="26">[Ne]3s²</text><text x="320" y="285" text-anchor="middle" font-size="26">[Ne]3s¹</text><text x="540" y="285" text-anchor="middle" font-size="26">[Ne]</text><text x="320" y="350" text-anchor="middle" font-size="25">Boxes: outer 3s orbital</text><text x="320" y="402" text-anchor="middle" font-size="25">[Ne]: ten inner electrons</text></g></svg>