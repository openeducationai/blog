<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" role="img" aria-labelledby="nernst-reaction-quotient-title"><title id="nernst-reaction-quotient-title">A balanced zinc–silver reaction transfers two electrons and places silver-ion activity squared in the reaction quotient.</title><rect width="640" height="430" fill="white"/><g font-family="Inter,sans-serif" fill="#141212"><text x="320" y="44" text-anchor="middle" font-size="30">Balance the electron transfer</text><rect x="38" y="80" width="564" height="93" rx="12" fill="#edf1ff"/><text x="320" y="119" text-anchor="middle" font-size="29">Zn → Zn²⁺ + 2e⁻</text><text x="320" y="155" text-anchor="middle" font-size="25">one zinc atom releases two electrons</text><rect x="38" y="197" width="564" height="93" rx="12" fill="#fff0e5"/><text x="320" y="236" text-anchor="middle" font-size="29">2Ag⁺ + 2e⁻ → 2Ag</text><text x="320" y="272" text-anchor="middle" font-size="25">two silver ions accept two electrons</text><text x="320" y="340" text-anchor="middle" font-size="28">Zn + 2Ag⁺ → Zn²⁺ + 2Ag</text><text x="130" y="395" text-anchor="middle" font-size="28">n = 2</text><text x="400" y="395" text-anchor="middle" font-size="28">Q = a(Zn²⁺) / a(Ag⁺)²</text></g></svg>