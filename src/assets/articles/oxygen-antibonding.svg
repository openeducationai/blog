<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" role="img" aria-labelledby="oxygen-antibonding-title"><title id="oxygen-antibonding-title">A schematic pi antibonding orbital has opposite phases on facing side-on lobes and an extra node between the nuclei.</title><rect width="640" height="430" fill="white"/><g font-family="Inter,sans-serif" fill="#141212"><text x="320" y="45" text-anchor="middle" font-size="30">Opposite phases make π*</text><path d="M65 220 H575 M575 220 l-12 -7 M575 220 l-12 7" stroke="#606a82" stroke-width="2"/><text x="582" y="210" font-size="25">z</text><path d="M205 220 C90 105 155 75 205 75 C255 75 320 105 205 220" fill="#edf1ff" stroke="#3568ff" stroke-width="3"/><text x="205" y="155" text-anchor="middle" font-size="32">+</text><path d="M205 220 C90 335 155 365 205 365 C255 365 320 335 205 220" fill="#fff0e5" stroke="#ff8235" stroke-width="3"/><text x="205" y="302" text-anchor="middle" font-size="32">−</text><circle cx="205" cy="220" r="5" fill="#141212"/><path d="M435 220 C320 105 385 75 435 75 C485 75 550 105 435 220" fill="#fff0e5" stroke="#ff8235" stroke-width="3"/><text x="435" y="155" text-anchor="middle" font-size="32">−</text><path d="M435 220 C320 335 385 365 435 365 C485 365 550 335 435 220" fill="#edf1ff" stroke="#3568ff" stroke-width="3"/><text x="435" y="302" text-anchor="middle" font-size="32">+</text><circle cx="435" cy="220" r="5" fill="#141212"/><path d="M320 80 V352" stroke="#606a82" stroke-width="2" stroke-dasharray="7 6"/><text x="320" y="387" text-anchor="middle" font-size="25">extra node between the nuclei</text><text x="320" y="419" text-anchor="middle" font-size="22">+ and − indicate phase, not charge</text></g></svg>