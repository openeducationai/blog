<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" role="img" aria-labelledby="em-field-directions-title"><title id="em-field-directions-title">Electric field along positive y, magnetic field out of the page along positive z, and propagation along positive x.</title><rect width="640" height="430" fill="white"/><g font-family="Inter,sans-serif" fill="#141212"><text x="320" y="48" text-anchor="middle" font-size="30">Three perpendicular directions</text><path d="M210 290 V105 M210 105 l-9 18 M210 105 l9 18" fill="none" stroke="#3568ff" stroke-width="4"/><path d="M230 290 H550 M550 290 l-18 -9 M550 290 l-18 9" fill="none" stroke="#606a82" stroke-width="4"/><circle cx="210" cy="290" r="17" fill="white" stroke="#ff8235" stroke-width="3"/><circle cx="210" cy="290" r="5" fill="#ff8235"/><text x="230" y="130" font-size="27" fill="#3568ff">E: +y</text><text x="385" y="270" font-size="25">travel: +x</text><text x="110" y="345" font-size="26" fill="#a74913">B: +z, out of the page</text><text x="320" y="400" text-anchor="middle" font-size="27">E × B points along the wave</text></g></svg>