<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" role="img" aria-labelledby="current-loop-normal-title"><title id="current-loop-normal-title">Measure theta between the loop normal and the magnetic field, not between its plane and the field.</title><rect width="640" height="430" fill="white"/><g font-family="Inter,sans-serif" fill="#141212"><text x="320" y="42" text-anchor="middle" font-size="30">Start with the normal</text><path d="M112 150 L408 320" stroke="#3568ff" stroke-width="8" stroke-linecap="round"/><path d="M260 235 L355 70 M340 81 L355 70 L353 89" fill="none" stroke="#ff8235" stroke-width="4" stroke-linejoin="round"/><path d="M260 235 H568 M553 224 L568 235 L553 246" fill="none" stroke="#2b8a3e" stroke-width="4"/><path d="M316 235 A56 56 0 0 0 288 187" fill="none" stroke="#141212" stroke-width="2"/><path d="M277 245 L287 228 L270 218" fill="none" stroke="#606a82" stroke-width="2"/><text x="370" y="108" font-size="27">Normal n̂</text><text x="534" y="215" font-size="27">B</text><text x="319" y="208" font-size="28">θ</text><text x="65" y="130" font-size="25">Loop edge</text><text x="320" y="396" text-anchor="middle" font-size="30">τ = NIAB sin θ</text></g></svg>