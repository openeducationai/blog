<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" role="img" aria-labelledby="gas-equilibrium-amounts-title"><title id="gas-equilibrium-amounts-title">A one-to-one reaction leaves helium unchanged and preserves the total amount of A plus B.</title><rect width="640" height="430" fill="white"/><g font-family="Inter,sans-serif" fill="#141212"><text x="320" y="48" text-anchor="middle" font-size="30">A(g) ⇌ B(g)</text><text x="80" y="112" font-size="26">Gas</text><text x="300" y="112" text-anchor="middle" font-size="26">Start / mol</text><text x="505" y="112" text-anchor="middle" font-size="26">At equilibrium</text><path d="M40 132 H600" stroke="#e7e2d8" stroke-width="2"/><rect x="40" y="149" width="560" height="56" rx="10" fill="#edf1ff"/><text x="80" y="187" font-size="28">A</text><text x="300" y="187" text-anchor="middle" font-size="28">1</text><text x="505" y="187" text-anchor="middle" font-size="28">1 − x mol</text><rect x="40" y="221" width="560" height="56" rx="10" fill="#fff0e5"/><text x="80" y="259" font-size="28">B</text><text x="300" y="259" text-anchor="middle" font-size="28">0</text><text x="505" y="259" text-anchor="middle" font-size="28">x mol</text><rect x="40" y="293" width="560" height="56" rx="10" fill="#f3f3f3"/><text x="80" y="331" font-size="28">He</text><text x="300" y="331" text-anchor="middle" font-size="28">1</text><text x="505" y="331" text-anchor="middle" font-size="28">1 mol</text><text x="320" y="404" text-anchor="middle" font-size="28">Each partial pressure = nRT / V</text></g></svg>