<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" role="img" aria-labelledby="integral-reflected-pairs-title"><title id="integral-reflected-pairs-title">Odd signed strips cancel; even reflected strips add.</title><rect width="640" height="430" fill="white"/><g font-family="Inter,sans-serif" fill="#141212"><text x="320" y="40" text-anchor="middle" font-size="29">Pair equal-width strips</text><g stroke="#b9cfff" stroke-width="1"><path d="M55 145 H285 M55 285 H285 M355 145 H585"/></g><path d="M55 215 H285 M170 110 V320 M355 285 H585 M470 110 V310" stroke="#606a82" stroke-width="2"/><path d="M75 305 L265 125" stroke="#3568ff" stroke-width="3" fill="none"/><path d="M375 125 Q470 445 565 125" stroke="#3568ff" stroke-width="3" fill="none"/><path d="M108.5 215 V267.1 H121.5 V215 Z" fill="#ff8235" opacity="0.5"/><path d="M218.5 215 V162.9 H231.5 V215 Z" fill="#3568ff" opacity="0.5"/><path d="M407.5 285 V229.4 H420.5 V285 Z M519.5 285 V229.4 H532.5 V285 Z" fill="#3568ff" opacity="0.5"/><g font-size="25" text-anchor="middle"><text x="170" y="88">Odd: y = x</text><text x="470" y="88">Even: y = x²</text><text x="114" y="340">−x</text><text x="226" y="340">x</text><text x="414" y="340">−x</text><text x="526" y="340">x</text><text x="170" y="392">Opposite signs</text><text x="470" y="392">Equal heights</text></g></g></svg>