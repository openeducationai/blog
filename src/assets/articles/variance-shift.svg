<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="variance-shift-title"><title id="variance-shift-title">Adding 5 to 2, 4, 6 gives 7, 9, 11. The mean moves from 4 to 9 and the distances from the mean stay unchanged.</title><rect width="640" height="360" fill="#f0ebe4"/><path d="M100 100 H540" fill="none" stroke="#606a82" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="180" cy="100" r="13" fill="#3568ff"/><text x="180" y="75" text-anchor="middle" fill="#141212" font-size="32" font-family="Inter,sans-serif" font-weight="400">2</text><circle cx="320" cy="100" r="13" fill="#ff8235"/><text x="320" y="75" text-anchor="middle" fill="#141212" font-size="32" font-family="Inter,sans-serif" font-weight="400">4</text><circle cx="460" cy="100" r="13" fill="#3568ff"/><text x="460" y="75" text-anchor="middle" fill="#141212" font-size="32" font-family="Inter,sans-serif" font-weight="400">6</text><text x="320" y="160" text-anchor="middle" fill="#606a82" font-size="32" font-family="Inter,sans-serif" font-weight="400">mean 4</text><path d="M100 260 H540" fill="none" stroke="#606a82" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="180" cy="260" r="13" fill="#3568ff"/><text x="180" y="235" text-anchor="middle" fill="#141212" font-size="32" font-family="Inter,sans-serif" font-weight="400">7</text><circle cx="320" cy="260" r="13" fill="#ff8235"/><text x="320" y="235" text-anchor="middle" fill="#141212" font-size="32" font-family="Inter,sans-serif" font-weight="400">9</text><circle cx="460" cy="260" r="13" fill="#3568ff"/><text x="460" y="235" text-anchor="middle" fill="#141212" font-size="32" font-family="Inter,sans-serif" font-weight="400">11</text><text x="320" y="320" text-anchor="middle" fill="#606a82" font-size="32" font-family="Inter,sans-serif" font-weight="400">mean 9</text><path d="M585 110 V240 M573 225 L585 240 L597 225" fill="none" stroke="#3568ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="585" y="85" text-anchor="middle" fill="#3568ff" font-size="32" font-family="Inter,sans-serif" font-weight="400">+5</text></svg>