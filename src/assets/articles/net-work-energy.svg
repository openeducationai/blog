<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" role="img" aria-labelledby="net-work-energy-title"><title id="net-work-energy-title">A forward pull and resistance contribute to the change in kinetic energy.</title><rect width="640" height="430" fill="white"/><g font-family="Inter,sans-serif" fill="#141212"><text x="320" y="45" text-anchor="middle" font-size="30">Add the work of all forces</text><rect x="235" y="155" width="170" height="85" rx="8" fill="#e7eeff" stroke="#3568ff" stroke-width="3"/><circle cx="268" cy="250" r="16" fill="#606a82"/><circle cx="372" cy="250" r="16" fill="#606a82"/><path d="M440 196 H590 M574 185 L590 196 L574 207" fill="none" stroke="#3568ff" stroke-width="5"/><path d="M200 196 H55 M71 185 L55 196 L71 207" fill="none" stroke="#ff8235" stroke-width="5"/><text x="515" y="142" text-anchor="middle" font-size="26">Pull: +18 J</text><text x="130" y="112" text-anchor="middle" font-size="25">Resistance</text><text x="130" y="146" text-anchor="middle" font-size="26">−6 J</text><text x="320" y="206" text-anchor="middle" font-size="27">Cart</text><text x="320" y="325" text-anchor="middle" font-size="27">Kinetic energy: 4 J → 16 J</text><text x="320" y="395" text-anchor="middle" font-size="27">Net work = 18 − 6 = 12 J</text></g></svg>