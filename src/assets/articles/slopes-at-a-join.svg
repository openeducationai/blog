<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" role="img" aria-labelledby="slopes-at-a-join-title"><title id="slopes-at-a-join-title">Absolute x has unequal one-sided slopes at zero; x squared has equal zero slopes.</title><rect width="640" height="430" fill="white"/><g font-family="Inter,sans-serif" fill="#141212"><text x="320" y="43" text-anchor="middle" font-size="30">Compare the slopes at zero</text><text x="165" y="95" text-anchor="middle" font-size="28">y = |x|</text><text x="475" y="95" text-anchor="middle" font-size="28">y = x²</text><path d="M45 300 H285 M165 325 V120 M355 300 H595 M475 325 V120" fill="none" stroke="#606a82" stroke-width="2"/><path d="M65 150 L165 300 L265 150" fill="none" stroke="#3568ff" stroke-width="5" stroke-linejoin="round"/><path d="M375 145 Q475 455 575 145" fill="none" stroke="#ff8235" stroke-width="5"/><path d="M425 300 H525" stroke="#141212" stroke-width="2" stroke-dasharray="7 5"/><text x="178" y="326" font-size="24">0</text><text x="489" y="326" font-size="24">0</text><text x="165" y="368" text-anchor="middle" font-size="25">−1 → +1</text><text x="475" y="368" text-anchor="middle" font-size="25">0 from both sides</text><text x="165" y="413" text-anchor="middle" font-size="24">Corner</text><text x="475" y="413" text-anchor="middle" font-size="24">Smooth join</text></g></svg>