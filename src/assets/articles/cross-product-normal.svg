<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" role="img" aria-labelledby="cross-product-normal-title"><title id="cross-product-normal-title">A cross product is perpendicular to its two input vectors.</title><rect width="640" height="430" fill="white"/><g font-family="Inter,sans-serif" fill="#141212"><text x="320" y="45" text-anchor="middle" font-size="30">A direction out of the plane</text><path d="M90 288 L285 170 L570 263 L375 370 Z" fill="#e7eeff" stroke="#b9cfff" stroke-width="2"/><path d="M260 283 L452 306 M439 294 L452 306 L437 313 M260 283 L370 215 M352 215 L370 215 L362 232" fill="none" stroke="#3568ff" stroke-width="4"/><path d="M260 283 V98 M250 112 L260 98 L270 112" fill="none" stroke="#ff8235" stroke-width="5"/><circle cx="260" cy="283" r="5" fill="#141212"/><text x="465" y="317" font-size="28">u</text><text x="384" y="217" font-size="28">v</text><text x="280" y="115" font-size="27">n = u × v</text><text x="320" y="407" text-anchor="middle" font-size="27">n · u = 0;   n · v = 0</text></g></svg>